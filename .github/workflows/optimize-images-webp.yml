name: Optimize active site images to WebP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-images-webp.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create lightweight mobile homepage logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('.')
          source = root / 'logo-transparent.webp'
          if not source.exists(): source = root / 'logo-transparent.png'
          if source.exists():
              mobile = root / 'logo-transparent-mobile.webp'
              with Image.open(source) as im:
                  im.load(); out = im.convert('RGBA'); max_width = 420
                  if out.width > max_width:
                      out = out.resize((max_width, round(out.height * max_width / out.width)), Image.Resampling.LANCZOS)
                  out.save(mobile, 'WEBP', quality=76, method=6)
          PY

      - name: Keep gallery category buttons on one desktop line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile-nav.js')
          text = p.read_text(encoding='utf-8')
          old = '".gallery-category-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}",'
          new = '".gallery-category-links{display:flex;flex-wrap:nowrap;gap:10px;justify-content:center;align-items:center}",'
          if old in text:
              text = text.replace(old, new, 1)
          old_mobile = '"@media(max-width:600px){.gallery-category-nav{margin:8px 0 28px;padding:18px 12px}.gallery-category-links{gap:8px}.gallery-category-links a{width:100%;padding:12px 14px}.gallery-category{margin-top:36px!important;margin-bottom:44px!important}.gallery-category>h2{font-size:32px!important}}"'
          new_mobile = '"@media(max-width:600px){.gallery-category-nav{margin:8px 0 28px;padding:18px 12px}.gallery-category-links{gap:8px;flex-wrap:wrap}.gallery-category-links a{width:100%;padding:12px 14px}.gallery-category{margin-top:36px!important;margin-bottom:44px!important}.gallery-category>h2{font-size:32px!important}}"'
          if old_mobile in text:
              text = text.replace(old_mobile, new_mobile, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Keep homepage service labels on one line on mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile-nav.js')
          text = p.read_text(encoding='utf-8')
          marker = '.home-theme .trust-item:nth-child(5){background:#f4f9ff!important;border-color:#c9def2!important}'
          addition = '.home-theme .service-bubble h3{white-space:nowrap!important;font-size:18px!important;padding-left:10px!important;padding-right:10px!important}'
          if addition not in text and marker in text:
              text = text.replace(marker, marker + addition, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit optimized assets and layout fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-nav.js logo-transparent-mobile.webp 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No changes were needed.'
          else
            git commit -m 'Keep mobile service labels on one line'
            git push origin HEAD:main
          fi
