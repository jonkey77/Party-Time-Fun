name: Optimize active site images to WebP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-images-webp.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create lightweight mobile homepage logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('.')
          source = root / 'logo-transparent.webp'
          if not source.exists():
              source = root / 'logo-transparent.png'
          if not source.exists():
              raise SystemExit('Homepage logo source not found')

          mobile = root / 'logo-transparent-mobile.webp'
          with Image.open(source) as im:
              im.load()
              out = im.convert('RGBA')
              max_width = 420
              if out.width > max_width:
                  new_height = round(out.height * max_width / out.width)
                  out = out.resize((max_width, new_height), Image.Resampling.LANCZOS)
              out.save(mobile, 'WEBP', quality=76, method=6)

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          old_preload = '<link rel="preload" as="image" href="./logo-transparent.webp?v=20260819-3" fetchpriority="high">'
          new_preload = '<link rel="preload" as="image" href="./logo-transparent-mobile.webp?v=20260824-1" media="(max-width:700px)" fetchpriority="high">\n<link rel="preload" as="image" href="./logo-transparent.webp?v=20260819-3" media="(min-width:701px)" fetchpriority="high">'
          text = text.replace(old_preload, new_preload)
          old_img = '<div class="hero-logo-card"><img src="./logo-transparent.webp?v=20260819-3" alt="Party Time Fun Face Painting logo" loading="eager" fetchpriority="high" decoding="async"></div>'
          new_img = '<div class="hero-logo-card"><picture><source media="(max-width:700px)" srcset="./logo-transparent-mobile.webp?v=20260824-1"><img src="./logo-transparent.webp?v=20260819-3" alt="Party Time Fun Face Painting logo" loading="eager" fetchpriority="high" decoding="async"></picture></div>'
          if old_img not in text:
              raise SystemExit('Homepage hero logo markup was not found; no HTML changed')
          text = text.replace(old_img, new_img, 1)
          index.write_text(text, encoding='utf-8')
          print('Created mobile logo:', mobile.stat().st_size, 'bytes')
          PY

      - name: Show mobile logo size
        run: ls -lh logo-transparent.webp logo-transparent-mobile.webp 2>/dev/null || true

      - name: Commit mobile logo and homepage reference
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html logo-transparent-mobile.webp
          if git diff --cached --quiet; then
            echo 'No mobile logo optimization changes were needed.'
          else
            git commit -m 'Use lightweight logo on mobile homepage'
            git push origin HEAD:main
          fi
