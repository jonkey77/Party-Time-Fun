name: Optimize active site images to WebP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-images-webp.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create lightweight mobile homepage logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('.')
          source = root / 'logo-transparent.webp'
          if not source.exists(): source = root / 'logo-transparent.png'
          if source.exists():
              mobile = root / 'logo-transparent-mobile.webp'
              with Image.open(source) as im:
                  im.load(); out = im.convert('RGBA'); max_width = 420
                  if out.width > max_width:
                      out = out.resize((max_width, round(out.height * max_width / out.width)), Image.Resampling.LANCZOS)
                  out.save(mobile, 'WEBP', quality=76, method=6)
          PY

      - name: Apply sharper homepage service typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old_title = '.service-bubble h3{display:inline-block;position:relative;margin:-11px auto 0;padding:9px 17px;border-radius:999px;color:#fff;font-family:"Brush Script MT","Segoe Script",cursive;font-size:23px;line-height:1}'
          new_title = '.service-bubble h3{display:inline-block;position:relative;margin:-11px auto 0;padding:9px 17px;border-radius:999px;color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.15;font-weight:900;letter-spacing:.01em;text-shadow:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}'
          if old_title in text:
              text = text.replace(old_title, new_title, 1)
          old_note = '.service-note{display:block;margin:9px auto 0;max-width:175px;color:#5d2a84;font-size:12px;line-height:1.35;font-weight:700}'
          new_note = '.service-note{display:block;margin:9px auto 0;max-width:175px;color:#46146f;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.42;font-weight:800;letter-spacing:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}'
          if old_note in text:
              text = text.replace(old_note, new_note, 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Remove Book Now links from desktop headers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('styles.css')
          text = css.read_text(encoding='utf-8')
          rule = '\n/* Hide header Book Now links on desktop; mobile keeps the booking pill. */\n@media(min-width:1051px){.top .links a[href$="book.html"]{display:none!important}}\n'
          if 'a[href$="book.html"]{display:none!important}' not in text:
              text += rule
              css.write_text(text, encoding='utf-8')

          for page in Path('.').glob('*.html'):
              html = page.read_text(encoding='utf-8')
              html = html.replace('styles.css?v=20260820-3', 'styles.css?v=20260824-8')
              html = html.replace('./styles.css?v=20260820-3', './styles.css?v=20260824-8')
              page.write_text(html, encoding='utf-8')
          PY

      - name: Keep gallery category buttons on one desktop line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile-nav.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('".gallery-category-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}",','".gallery-category-links{display:flex;flex-wrap:nowrap;gap:10px;justify-content:center;align-items:center}",',1)
          text = text.replace('"@media(max-width:600px){.gallery-category-nav{margin:8px 0 28px;padding:18px 12px}.gallery-category-links{gap:8px}.gallery-category-links a{width:100%;padding:12px 14px}.gallery-category{margin-top:36px!important;margin-bottom:44px!important}.gallery-category>h2{font-size:32px!important}}"','"@media(max-width:600px){.gallery-category-nav{margin:8px 0 28px;padding:18px 12px}.gallery-category-links{gap:8px;flex-wrap:wrap}.gallery-category-links a{width:100%;padding:12px 14px}.gallery-category{margin-top:36px!important;margin-bottom:44px!important}.gallery-category>h2{font-size:32px!important}}"',1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Keep homepage service labels on one line on mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile-nav.js')
          text = p.read_text(encoding='utf-8')
          marker = '.home-theme .trust-item:nth-child(5){background:#f4f9ff!important;border-color:#c9def2!important}'
          addition = '.home-theme .service-bubble h3{white-space:nowrap!important;font-size:17px!important;padding-left:9px!important;padding-right:9px!important}'
          if addition not in text and marker in text:
              text = text.replace(marker, marker + addition, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit site fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add *.html styles.css mobile-nav.js logo-transparent-mobile.webp 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No changes were needed.'
          else
            git commit -m 'Remove Book Now links from desktop headers'
            git push origin HEAD:main
          fi
