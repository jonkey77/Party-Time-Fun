name: Prepare all site PNG images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/convert-jpegs-to-png.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Convert site JPEGs to assets PNGs and update pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          from collections import deque
          import numpy as np

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('.')
          assets = root / 'assets'
          assets.mkdir(exist_ok=True)

          image_names = [
              'face-feature.JPG','face-gallery1.JPG','face-gallery2.JPG','face-gallery3.JPG','face-gallery4.JPG','face-gallery5.JPG',
              'balloon-feature.jpg','balloon1.jpg','balloon2.jpg','balloon3.jpg','balloon4.JPG','balloon-service.JPG',
              'glitter-feature.JPG','glitter1.JPG','glitter2.JPG','glitter3.jpg','glitter4.JPG','glitterbar-service.jpg',
              'glittertat-feature.JPG','glittertat1.jpg','glittertat2.jpg','glittertat3.JPG','glittertat4.JPG',
              'temp-rose.jpg','temp-tribal.jpg','temp-seahorse.jpg'
          ]

          made = {}
          for name in image_names:
              src = root / name
              if not src.exists():
                  continue
              dst = assets / (src.stem + '.png')
              with Image.open(src) as im:
                  im.load()
                  if im.mode in ('RGBA','LA'):
                      out = im.convert('RGBA')
                  else:
                      out = im.convert('RGB')
                  out.save(dst, 'PNG', optimize=True)
              made[name] = dst.as_posix()

          logo_src = root / 'logo.png'
          logo_dst = assets / 'logo-transparent.png'
          if logo_src.exists():
              with Image.open(logo_src) as im:
                  rgba = im.convert('RGBA')
                  arr = np.array(rgba)
                  rgb = arr[:, :, :3]
                  h, w = rgb.shape[:2]
                  white = (rgb[:,:,0] > 238) & (rgb[:,:,1] > 238) & (rgb[:,:,2] > 238)
                  seen = np.zeros((h,w), dtype=bool)
                  q = deque()
                  for x in range(w):
                      if white[0,x]: q.append((0,x))
                      if white[h-1,x]: q.append((h-1,x))
                  for y in range(h):
                      if white[y,0]: q.append((y,0))
                      if white[y,w-1]: q.append((y,w-1))
                  while q:
                      y,x = q.popleft()
                      if y < 0 or y >= h or x < 0 or x >= w or seen[y,x] or not white[y,x]:
                          continue
                      seen[y,x] = True
                      q.extend(((y-1,x),(y+1,x),(y,x-1),(y,x+1)))
                  arr[seen,3] = 0
                  Image.fromarray(arr,'RGBA').save(logo_dst,'PNG',optimize=True)

          page_files = ['services.html','gallery.html','about.html','book.html','contact.html']
          basic = {
              'assets/logo.jpg':'assets/logo-transparent.png',
              './assets/logo.jpg':'./assets/logo-transparent.png',
              'assets/face-feature.jpg':'assets/face-feature.png',
              'assets/balloon-feature.jpg':'assets/balloon-feature.png',
              'assets/glitter-feature.jpg':'assets/glitter-feature.png',
              'assets/glittertat-feature.jpg':'assets/glittertat-feature.png',
              'assets/temp-rose.jpg':'assets/temp-rose.png',
              './assets/face-feature.jpg':'./assets/face-feature.png',
              './assets/balloon-feature.jpg':'./assets/balloon-feature.png',
              './assets/glitter-feature.jpg':'./assets/glitter-feature.png',
              './assets/glittertat-feature.jpg':'./assets/glittertat-feature.png',
              './assets/temp-rose.jpg':'./assets/temp-rose.png'
          }
          for page_name in page_files:
              p = root / page_name
              if not p.exists(): continue
              text = p.read_text(encoding='utf-8')
              for old,new in basic.items(): text = text.replace(old,new)
              p.write_text(text,encoding='utf-8')

          # Replace Gallery sprite-based tiles with individual PNG images.
          gp = root / 'gallery.html'
          if gp.exists():
              text = gp.read_text(encoding='utf-8')
              import re
              groups = {
                  'face-sprite.webp':['face-feature.png','face-gallery1.png','face-gallery2.png','face-gallery3.png','face-gallery4.png','face-gallery5.png'],
                  'balloon-sprite.webp':['balloon-feature.png','balloon1.png','balloon2.png','balloon3.png','balloon4.png'],
                  'glitter-sprite.webp':['glitter-feature.png','glitter1.png','glitter2.png','glitter3.png','glitter4.png'],
                  'glittertat-sprite.webp':['glittertat-feature.png','glittertat1.png','glittertat2.png','glittertat3.png','glittertat4.png'],
                  'temp-sprite.webp':['temp-rose.png','temp-tribal.png','temp-seahorse.png']
              }
              for sprite, files in groups.items():
                  pattern = re.compile(r'<div class="sprite[^>]*"[^>]*style="[^"]*background-image:\s*url\([^)]*'+re.escape(sprite)+r'[^)]*\)[^"]*"[^>]*></div>')
                  matches = list(pattern.finditer(text))
                  for i,m in reversed(list(enumerate(matches))):
                      if i < len(files):
                          repl = '<img class="gallery-png" src="./assets/'+files[i]+'" alt="Party Time Fun gallery photo" loading="lazy">'
                          text = text[:m.start()] + repl + text[m.end():]
              # Fallback for sprite elements using CSS classes/background positions: replace sequential occurrences containing each sprite.
              for sprite, files in groups.items():
                  idx = 0
                  def repl(m):
                      nonlocal_idx = None
                      return m.group(0)
                  # Directly replace img src references if any remain.
                  text = text.replace('./assets/'+sprite, './assets/'+files[0])
                  text = text.replace('assets/'+sprite, 'assets/'+files[0])
              # Ensure direct PNG gallery images size consistently.
              if '</head>' in text and '.gallery-png{' not in text:
                  text = text.replace('</head>','<style>.gallery-png{display:block;width:100%;height:260px;object-fit:cover;object-position:center;border-radius:18px}@media(max-width:700px){.gallery-png{height:210px}}</style></head>')
              gp.write_text(text,encoding='utf-8')
          PY
      - name: Commit all PNG images and page updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.png services.html gallery.html about.html book.html contact.html || true
          if git diff --cached --quiet; then
            echo 'No site PNG changes were needed.'
          else
            git commit -m 'Convert site photos to PNG and update five pages'
            git push origin HEAD:main
          fi
