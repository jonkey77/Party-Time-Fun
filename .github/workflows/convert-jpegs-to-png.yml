name: Convert JPEG site images to PNG

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/convert-jpegs-to-png.yml'

permissions:
  contents: write

jobs:
  convert:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Convert site JPEG images to PNG'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Convert JPEG assets and update pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          assets = root / 'assets'
          jpgs = sorted([*assets.glob('*.jpg'), *assets.glob('*.jpeg'), *assets.glob('*.JPG'), *assets.glob('*.JPEG')])
          replacements = {}

          for src in jpgs:
              dst = src.with_suffix('.png')
              with Image.open(src) as im:
                  if im.mode in ('RGBA', 'LA'):
                      out = im.convert('RGBA')
                  else:
                      out = im.convert('RGB')
                  out.save(dst, 'PNG', optimize=True)
              replacements[f'assets/{src.name}'] = f'assets/{dst.name}'

          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              page.write_text(text, encoding='utf-8')

          for src in jpgs:
              src.unlink()
          PY
      - name: Use transparent logo PNG on all pages
        shell: bash
        run: |
          if [ -f assets/logo-transparent.webp ]; then
            python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path('assets/logo-transparent.webp')
          dst = Path('assets/logo.png')
          with Image.open(src) as im:
              im.convert('RGBA').save(dst, 'PNG', optimize=True)
          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8').replace('assets/logo-transparent.webp','assets/logo.png')
              page.write_text(text, encoding='utf-8')
          PY
          fi
      - name: Commit converted PNG files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No JPEG files needed conversion.'
          else
            git commit -m 'Convert site JPEG images to PNG'
            git push origin HEAD:main
          fi
