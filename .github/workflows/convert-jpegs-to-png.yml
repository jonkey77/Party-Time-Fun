name: Prepare homepage PNG images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/convert-jpegs-to-png.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Convert homepage JPEGs and make transparent logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from collections import deque
          import numpy as np

          root = Path('.')
          feature_names = [
              'face-feature.JPG',
              'balloon-feature.jpg',
              'glitter-feature.JPG',
              'glittertat-feature.JPG',
              'temp-rose.jpg',
          ]

          replacements = {}
          for name in feature_names:
              src = root / name
              if not src.exists():
                  continue
              dst = root / (src.stem + '.png')
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  im.save(dst, 'PNG', optimize=True)
              replacements[f'./{name}'] = f'./{dst.name}'

          logo = root / 'logo.png'
          if logo.exists():
              with Image.open(logo) as im:
                  rgba = im.convert('RGBA')
                  arr = np.array(rgba)
                  rgb = arr[:, :, :3]
                  h, w = rgb.shape[:2]
                  white = (rgb[:, :, 0] > 238) & (rgb[:, :, 1] > 238) & (rgb[:, :, 2] > 238)
                  seen = np.zeros((h, w), dtype=bool)
                  q = deque()
                  for x in range(w):
                      if white[0, x]: q.append((0, x))
                      if white[h-1, x]: q.append((h-1, x))
                  for y in range(h):
                      if white[y, 0]: q.append((y, 0))
                      if white[y, w-1]: q.append((y, w-1))
                  while q:
                      y, x = q.popleft()
                      if y < 0 or y >= h or x < 0 or x >= w or seen[y, x] or not white[y, x]:
                          continue
                      seen[y, x] = True
                      q.extend(((y-1,x),(y+1,x),(y,x-1),(y,x+1)))
                  arr[seen, 3] = 0
                  Image.fromarray(arr, 'RGBA').save(root / 'logo-transparent.png', 'PNG', optimize=True)

          index = root / 'index.html'
          if index.exists():
              text = index.read_text(encoding='utf-8')
              text = text.replace('./logo.png', './logo-transparent.png')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              index.write_text(text, encoding='utf-8')
          PY
      - name: Commit prepared homepage images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html logo-transparent.png *-feature.png temp-rose.png || true
          if git diff --cached --quiet; then
            echo 'No homepage image changes were needed.'
          else
            git commit -m 'Prepare transparent logo and PNG homepage images'
            git push origin HEAD:main
          fi
