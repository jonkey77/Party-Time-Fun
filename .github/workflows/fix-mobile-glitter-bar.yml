name: Fix mobile Glitter Bar label

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-glitter-bar.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append mobile homepage label fix
        shell: bash
        run: |
          if ! grep -q "mobile-glitter-bar-one-line" styles.css; then
            cat >> styles.css <<'EOF'

/* mobile-glitter-bar-one-line */
@media(max-width:700px){
  .home-theme .service-bubble h3{
    white-space:nowrap!important;
    font-size:15px!important;
    padding-left:6px!important;
    padding-right:6px!important;
    letter-spacing:0!important;
  }
}
EOF
          fi
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Keep mobile homepage service labels on one line"
          git push
